experiment_name: full_system_local
description: Deterministic local end-to-end run for CTR updates and streaming weight updates.
settle_seconds: 8
tags:
  - local
  - full-system
  - destructive
setup:
  reset_values: true
  clean_topics: true
  seed_values: true
processors:
  realtime_ctr:
    enabled: true
    command:
      - "{python}"
      - "-m"
      - "ctx_ctr.jobs.run_realtime_ctr"
      - "--consumer-group"
      - "ctx-ctr-exp-full-system-realtime"
      - "--log-every"
      - "500"
    startup_seconds: 12
    stop_timeout_seconds: 20
  streaming_weight_update:
    enabled: true
    command:
      - "{python}"
      - "-m"
      - "ctx_ctr.jobs.run_streaming_weight_update"
      - "--consumer-group"
      - "ctx-ctr-exp-full-system-weight"
      - "--interval-seconds"
      - "4"
      - "--min-feature-impressions"
      - "50"
      - "--max-feature-ci-width"
      - "0.20"
      - "--baseline-max-ci-width"
      - "0.20"
    startup_seconds: 12
    stop_timeout_seconds: 20
traffic:
  enabled: true
  impressions: 100
  events_per_second: 20
  random_seed: 42
  log_every: 100
  also_unified: false
  phases:
    - phase_name: warmup
      impressions: 400
      events_per_second: 25
      random_seed: 101
      settle_seconds: 6
      log_every: 250
      also_unified: false
    - phase_name: steady
      impressions: 1200
      events_per_second: 50
      random_seed: 202
      settle_seconds: 8
      log_every: 500
      also_unified: false
    - phase_name: burst
      impressions: 400
      events_per_second: 100
      random_seed: 303
      settle_seconds: 8
      log_every: 250
      also_unified: false
success_gates:
  require_processor_health: true
  require_redis_impression_delta_match: false
  require_redis_click_delta_match: false
  require_model_snapshot_created: true
  max_invalid_redis_buckets: 0
