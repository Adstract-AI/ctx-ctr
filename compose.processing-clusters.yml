services:
  flink-jobmanager:
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    image: ctx-ctr/flink-jobmanager-python:1.19.1
    container_name: ctx-ctr-flink-jobmanager
    command: jobmanager
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-ctx_ctr}:${POSTGRES_PASSWORD:-ctx_ctr}@postgres:5432/${POSTGRES_DB:-ctx_ctr}
      PYTHONPATH: /opt/ctx-ctr/src
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_COLOR: ${LOG_COLOR:-cyan}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 1
        python.client.executable: /usr/bin/python3
        python.executable: /usr/bin/python3
    ports:
      - "${FLINK_JOBMANAGER_PORT:-8081}:8081"
    volumes:
      - ./src:/opt/ctx-ctr/src
      - ./configs:/opt/ctx-ctr/configs:ro
      - ./jars:/opt/ctx-ctr/jars:ro
      - ./jobs:/opt/ctx-ctr/jobs
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  flink-taskmanager:
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
    image: ctx-ctr/flink-taskmanager-python:1.19.1
    container_name: ctx-ctr-flink-taskmanager
    command: taskmanager
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-ctx_ctr}:${POSTGRES_PASSWORD:-ctx_ctr}@postgres:5432/${POSTGRES_DB:-ctx_ctr}
      PYTHONPATH: /opt/ctx-ctr/src
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_COLOR: ${LOG_COLOR:-cyan}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 1
        python.client.executable: /usr/bin/python3
        python.executable: /usr/bin/python3
    volumes:
      - ./src:/opt/ctx-ctr/src
      - ./configs:/opt/ctx-ctr/configs:ro
      - ./jars:/opt/ctx-ctr/jars:ro
      - ./jobs:/opt/ctx-ctr/jobs
    depends_on:
      flink-jobmanager:
        condition: service_started

  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: ctx-ctr/spark-master-python:3.5.1
    container_name: ctx-ctr-spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "${SPARK_MASTER_WEBUI_PORT:-8080}:8080"
      - "${SPARK_MASTER_PORT:-7077}:7077"
    volumes:
      - ./src:/opt/ctx-ctr/src
      - ./jobs:/opt/ctx-ctr/jobs
      - ./experiments:/opt/ctx-ctr/experiments

  spark-worker:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: ctx-ctr/spark-worker-python:3.5.1
    container_name: ctx-ctr-spark-worker
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - 2G
      - --webui-port
      - "8081"
    ports:
      - "${SPARK_WORKER_WEBUI_PORT:-8082}:8081"
    volumes:
      - ./src:/opt/ctx-ctr/src
      - ./jobs:/opt/ctx-ctr/jobs
      - ./experiments:/opt/ctx-ctr/experiments
    depends_on:
      spark-master:
        condition: service_started
